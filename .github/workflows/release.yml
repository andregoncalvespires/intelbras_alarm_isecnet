name: Release

on:
  push:
    branches: [main]
    paths:
      - custom_components/intelbras_alarm/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler a versão
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/intelbras_alarm/manifest.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Criar a release se a tag ainda não existe
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "A release $tag já existe; nada a fazer."
            exit 0
          fi
          # Versões com sufixo (ex.: 2.1.6-beta) saem como pre-release.
          flags=""
          if [[ "$VERSION" == *-* ]]; then
            flags="--prerelease"
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes $flags
